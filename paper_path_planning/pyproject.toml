[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-path-planning"
version = "1.0.0"
description = "PSO and hybrid PSO–SAC multi-UAV path planning (A. Ali et al.)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "torch>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["paper_path_planning*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
